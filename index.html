<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plans for Days x The Boys Awards 2026</title>
<style>
:root{--bg:#f7f3ee;--ink:#2d2927;--muted:#776f69;--line:#e7ddd5;--card:#fff;--accent:#6b4f3a;--r:26px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#f7f3eef2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:-.035em}.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
main{width:min(1100px,calc(100% - 28px));margin:auto;padding:25px 0 70px}.hero{text-align:center;padding:46px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-weight:950;font-size:11px;color:var(--accent)}h1{font-size:clamp(38px,7vw,78px);line-height:.94;letter-spacing:-.06em;margin:13px auto;max-width:900px}h2{letter-spacing:-.035em}.sub{max-width:680px;margin:0 auto 22px;color:var(--muted);line-height:1.55}
.btn{background:var(--ink);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:900;box-shadow:0 8px 22px #2d29271c}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#8d3030}.btn.small{padding:9px 12px;font-size:13px;border-radius:13px}.ghost{background:transparent;border:0;font-weight:900;padding:10px;border-radius:999px}.ghost:hover{background:#fff}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.person{min-height:145px;border:1px solid #0000000d;border-radius:28px;padding:19px;text-align:left;box-shadow:0 14px 35px #2d29270f;display:flex;flex-direction:column;justify-content:space-between;transition:.16s}.person:hover{transform:translateY(-2px)}.person.voted{filter:saturate(.5) brightness(.88)}.person img{width:58px;height:58px;object-fit:cover;border-radius:19px;border:3px solid #ffffffb8}.person .name{font-size:22px;font-weight:950;letter-spacing:-.04em}.status{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.progress{position:sticky;top:66px;z-index:10;padding:12px 0;background:#f7f3eef4;backdrop-filter:blur(10px)}.progline{display:flex;justify-content:space-between;font-size:13px;font-weight:950;margin-bottom:7px}.track{height:9px;background:#e5ddd6;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--ink);border-radius:99px;transition:.2s}
.cat{margin:28px 0 12px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:12px 16px;display:flex;justify-content:space-between}.cat span{font-size:11px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:12px 0;box-shadow:0 9px 26px #2d29270b}.q h3{margin:0 0 15px;letter-spacing:-.025em}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{min-height:64px;border:2px solid transparent;background:#faf8f6;border-radius:20px;padding:12px;text-align:left;font-weight:900}.choice.selected{border-color:var(--ink);box-shadow:0 0 0 3px #2d292714}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:17px;padding:13px 15px;background:#fff;outline:0}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#a28c7b;box-shadow:0 0 0 4px #6b4f3a12}.actions{display:flex;justify-content:space-between;gap:10px;margin:22px 0}.notice{background:#fff8e8;border:1px solid #f0dfb8;border-radius:18px;padding:14px 16px;color:#6b5527;font-weight:750}
.modalbg{position:fixed;inset:0;background:#19151373;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(540px,100%);background:#fff;border-radius:30px;padding:24px;box-shadow:0 30px 90px #0004}.modal h2{margin-top:0}.mactions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 12px 32px #2d29270b}.panel h3{margin-top:0}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:18px;padding:11px 13px}.pill{display:inline-flex;border-radius:999px;background:#f2ece7;padding:6px 9px;font-size:11px;font-weight:950}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pres{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column}.presTop{padding:15px 22px;display:flex;justify-content:space-between}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}.inner{width:min(1350px,94vw);text-align:center}.presCat{font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:15px}.presTitle{font-size:clamp(48px,9vw,120px);line-height:.9;letter-spacing:-.065em;margin:0;font-weight:950}.nominees{display:flex;justify-content:center;gap:18px;align-items:stretch;flex-wrap:wrap}.nom{width:min(28vw,300px);min-width:180px;min-height:330px;border-radius:34px;padding:19px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 18px 50px #2d29271c}.nom img{display:none;width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;margin-bottom:13px}.nom.photo img{display:block}.nomName{font-size:clamp(21px,3vw,36px);font-weight:950;letter-spacing:-.045em}.crown{display:none;position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:42px}.winner .crown{display:block}.winner{transform:scale(1.12);z-index:2;box-shadow:0 28px 75px #2d29274a!important}.notwinner{transform:scale(.9);opacity:.8}.votes{font-weight:900;opacity:.7;margin-top:5px}.presNav{padding:15px 20px 24px;display:flex;justify-content:center;gap:9px}.help{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.mini{width:auto;padding:8px 10px;border-radius:12px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed}
.resrow{display:grid;grid-template-columns:34px minmax(110px,1fr) 1.4fr auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.resrow.win{font-weight:900}.rank{font-weight:950;color:var(--muted);text-align:center}.bar{height:12px;background:#eee7e1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;box-shadow:inset 0 0 0 1px #0002}.rv{font-size:13px;color:var(--muted);white-space:nowrap}
.presAward{font-size:clamp(26px,4vw,54px);margin:0 0 22px;letter-spacing:-.045em}.presLabel{font-size:clamp(14px,1.8vw,22px);font-weight:950;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:22px}.presSub{color:var(--muted);font-size:clamp(16px,2vw,28px);margin-top:22px}.tie{font-size:clamp(22px,3vw,40px);font-weight:950;margin-bottom:22px}.pct{font-size:clamp(30px,4.6vw,66px);font-weight:950;letter-spacing:-.05em;line-height:1;margin-top:8px}.winner .pct{font-size:clamp(40px,6vw,90px)}.nom.duo{min-height:210px}.pcount{align-self:center;font-weight:900;color:var(--muted);min-width:70px;text-align:center}.inner{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.inner{animation:none}}
@media(max-width:760px){.people,.choices,.adminGrid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.nom{min-width:145px;width:38vw;min-height:240px}.resrow{grid-template-columns:30px 1fr auto}.resrow .bar{grid-column:1/-1}}
@media(max-width:520px){.people,.choices,.adminGrid{grid-template-columns:1fr}.nom{width:72vw}.winner{transform:scale(1.03)}}
</style>
</head>
<body><div id="app"></div>
<script>

const state={event:null,me:null,answers:{},mode:"home",presIndex:0,presStage:0};
const api=path=>"/api/"+path;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const colorText=h=>{let x=h.replace("#","");let r=parseInt(x.slice(0,2),16),g=parseInt(x.slice(2,4),16),b=parseInt(x.slice(4,6),16);return (r*299+g*587+b*114)/1000>165?"#2d2927":"#fff"};
async function call(path,body={}){let r=await fetch(api(path),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||"Something went wrong");return j}
function topbar(){return `<div class="top"><div class="brand">${esc(state.event?.event_name||"Award Night")}<small>Award Night 2026</small></div><button class="ghost" onclick="admin()">Admin</button></div>`}
async function init(){if(window.__BACKUP__){state.resultsData=window.__BACKUP__;state.event={event_name:window.__BACKUP__.event_name};openPres(window.__BACKUP__,window.__BACKUP__.suspense!==false);return}try{state.event=await call("event");renderHome()}catch(e){document.getElementById("app").innerHTML=`<main><section class="hero"><h1>Setup needed</h1><p class="sub">${esc(e.message)}</p></section></main>`}}
function renderHome(){
 const e=state.event; const people=e.people; const voted=e.voted_count;
 const cards=people.map(p=>`<button class="person ${p.voted?"voted":""}" style="background:${p.color};color:${colorText(p.color)}" onclick="pick('${esc(p.name)}')">${p.photo?`<img src="${esc(p.photo)}">`:""}<div><div class="name">${esc(p.name)}</div><div class="status">${p.voted?"Voted ✓":"Not voted"}</div></div></button>`).join("");
 document.getElementById("app").innerHTML=topbar()+`<main><section class="hero"><div class="eyebrow">🏆 Award Night</div><h1>${esc(e.event_name)}</h1><p class="sub">Vote for your friends. You can return and change your answers until voting closes.</p>${e.closed?`<div class="notice">🔒 Voting has closed.</div>`:e.not_open?`<div class="notice">⏳ Voting has not opened yet.</div>`:`<div class="pill">${voted}/${people.length} people have voted</div>`}</section><div class="people">${cards}</div></main>`;
}
async function pick(name){
 if(state.event.closed||state.event.not_open)return;
 try{let existing=await call("voter",{name});state.me=name;
  if(existing.exists) modal(`<h2>You're voting as ${esc(name)}</h2><p>Enter your voting password to continue.</p><input id="pass" type="password" placeholder="Password"><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="unlock()">Continue</button></div>`);
  else modal(`<h2>You're voting as ${esc(name)}</h2><p>Create a password. You can use it to return and change answers before voting closes.</p><input id="pass" type="password" placeholder="Create password"><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="createVoter()">Create & Continue</button></div>`);
 }catch(e){alert(e.message)}
}
async function createVoter(){let p=document.getElementById("pass").value;if(!p)return alert("Enter a password.");try{await call("voter",{name:state.me,password:p,create:true});sessionPass=p;closeModal();await loadVoting()}catch(e){alert(e.message)}}
async function unlock(){let p=document.getElementById("pass").value;try{let r=await call("voter",{name:state.me,password:p,login:true});sessionPass=p;state.answers=r.answers||{};closeModal();await loadVoting()}catch(e){alert(e.message)}}
async function loadVoting(){let r=await call("questions",{voter:state.me,password:await getSessionPassword()});state.answers=r.answers||{};state.questions=r.questions;renderVoting()}
let sessionPass="";
async function getSessionPassword(){return sessionPass}
async function createAndStorePassword(){return ""}
const optsFor=q=>state.event.people.filter(p=>!q.audience||q.audience==="all"||p.sex===q.audience);
const okAns=q=>{const v=state.answers[q.id];if(!v)return false;return q.type==="person"?optsFor(q).some(p=>p.name===v):true};
const cleanAnswers=()=>Object.fromEntries(state.questions.filter(okAns).map(q=>[q.id,state.answers[q.id]]));
function renderVoting(){
 const qs=state.questions,total=qs.length,answered=qs.filter(okAns).length;
 const cats=[...new Set(qs.map(q=>q.category))];
 let body=`<main><div class="progress"><div class="progline"><span>Voting as ${esc(state.me)}</span><span>${answered}/${total} questions answered</span></div><div class="track"><div class="fill" style="width:${total?answered/total*100:0}%"></div></div></div>`;
 cats.forEach(c=>{body+=`<div class="cat"><b>${esc(c)}</b><span>${qs.filter(q=>q.category===c).length} questions</span></div>`;qs.filter(q=>q.category===c).forEach(q=>{
 body+=`<section class="q"><h3>${esc(q.title)}${q.type==="person"&&q.audience&&q.audience!=="all"?` <span class="pill">${q.audience==="female"?"Female nominees only":"Male nominees only"}</span>`:""}</h3>`;
 if(q.type==="person")body+=`<div class="choices">${optsFor(q).map(p=>{let sel=state.answers[q.id]===p.name;return `<button class="choice ${sel?"selected":""}" style="${sel?`background:${p.color};color:${colorText(p.color)}`:""}" onclick="answer('${esc(q.id)}','${esc(p.name)}')"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`}).join("")}</div>`;
 else body+=`<textarea oninput="duo('${esc(q.id)}',this.value)" placeholder="Enter the two people...">${esc(state.answers[q.id]||"")}</textarea><p style="font-size:12px;color:var(--muted)">Text input only. Enter the two people.</p>`;
 body+=`</section>`})});
 body+=`<div class="actions"><button class="btn secondary" onclick="renderHome()">Save & return later</button><button class="btn" onclick="submit()">Submit final votes</button></div><div class="notice">Your answers stay editable until the official closing time.</div></main>`;
 document.getElementById("app").innerHTML=topbar()+body;
}
async function answer(id,val){state.answers[id]=val;saveRemote(false);renderVoting()}
let saveTimer;function duo(id,val){state.answers[id]=val.trim();clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveRemote(false),400)}
async function saveRemote(submitted){try{await call("save",{voter:state.me,password:sessionPass,answers:cleanAnswers(),submitted})}catch(e){}}
async function submit(){let missing=state.questions.filter(q=>!okAns(q));if(missing.length)return alert(`Please answer all ${missing.length} remaining question${missing.length>1?"s":""}.`);try{await call("save",{voter:state.me,password:sessionPass,answers:cleanAnswers(),submitted:true});document.getElementById("app").innerHTML=`<main><section class="hero"><div class="eyebrow">✓ Submitted</div><h1>You're done, ${esc(state.me)}.</h1><p class="sub">Your votes are saved. You can come back with your password and change them until voting closes.</p><button class="btn" onclick="state.event=null;init()">Back to voting home</button></section></main>`}catch(e){alert(e.message);if(/^Please answer/.test(e.message))await loadVoting()}}
function modal(x){let d=document.createElement("div");d.id="modal";d.className="modalbg";d.innerHTML=`<div class="modal">${x}</div>`;document.body.appendChild(d);setTimeout(()=>document.getElementById("pass")?.focus(),40)}
function closeModal(){document.getElementById("modal")?.remove()}
async function admin(){modal(`<h2>Admin controls</h2><p>Enter your admin password.</p><input id="pass" type="password" placeholder="Admin password"><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="unlockAdmin()">Enter</button></div>`)}
async function unlockAdmin(){try{let r=await call("admin",{password:document.getElementById("pass").value});closeModal();state.adminToken=r.token;renderAdmin()}catch(e){alert(e.message)}}
const ADMIN_CATS=["Personality","Wild / Funny","Inspirational"];
const AUD_LABEL={all:"Everyone can be picked",male:"Males only",female:"Females only"};
const audOptions=cur=>["all","male","female"].map(v=>`<option value="${v}" ${v===(cur||"all")?"selected":""}>${AUD_LABEL[v]}</option>`).join("");
const loc=d=>{if(!d)return"";const t=new Date(d);return new Date(t-t.getTimezoneOffset()*60000).toISOString().slice(0,16)};
async function keepScroll(fn){const y=window.scrollY;await fn();window.scrollTo(0,y)}
async function renderAdmin(){let e=await call("admin-data",{token:state.adminToken});e={...e.event,event:e.event};state.admin=e;
const ready=!!e.closed;
document.getElementById("app").innerHTML=topbar()+`<main><section class="hero" style="text-align:left"><div class="eyebrow">Admin</div><h1 style="font-size:clamp(42px,6vw,70px)">Control Room</h1><p class="sub" style="margin-left:0">Manage people, awards, voting, results and the awards night.</p></section><div class="adminGrid">
<section class="panel"><h3>Event</h3><input id="eventName" value="${esc(e.event.event_name)}"><br><br><div class="row"><label>Opens<input id="open" type="datetime-local" value="${loc(e.event.opening_at)}"></label><label>Closes<input id="close" type="datetime-local" value="${loc(e.event.closing_at)}"></label></div><br><button class="btn small" onclick="saveSettings()">Save settings</button> <button class="btn danger small" onclick="closeNow()">Close voting now</button> ${e.event.closing_at?`<button class="btn secondary small" onclick="reopenVoting()">Reopen voting</button>`:""}<p><b>${e.voted_count}/${e.people.length}</b> people have voted. Voting is <b>${e.closed?"closed":e.not_open?"not open yet":"open"}</b>.</p></section>
<section class="panel"><h3>People</h3><div class="list">${e.people.map(p=>`<div class="item"><span><b>${esc(p.name)}</b> <span class="pill">${p.voted?"Voted":"Not voted"}</span></span><span style="display:flex;gap:8px;align-items:center"><select class="mini" onchange="setSex('${esc(p.name)}',this.value)"><option value="male" ${p.sex!=="female"?"selected":""}>Male</option><option value="female" ${p.sex==="female"?"selected":""}>Female</option></select><label class="btn secondary small">Photo<input type="file" accept="image/*" hidden onchange="photo('${esc(p.name)}',this.files[0])"></label></span></div>`).join("")}</div></section></div>
<section class="panel" style="margin-top:16px"><h3>Results &amp; Awards Night</h3>${ready?`<p class="sub" style="margin:0 0 14px">Voting is closed. Results are ready.</p>`:`<div class="notice" style="margin-bottom:14px">🔒 Results and the awards night unlock once voting has closed.</div>`}<button class="btn small" ${ready?"":"disabled"} onclick="renderResults()">📊 View results</button> <button class="btn small" ${ready?"":"disabled"} onclick="startPresentation()">🎬 Start Awards Night</button></section>
${ADMIN_CATS.map((c,ci)=>{const list=e.awards.filter(a=>a.category===c);return `<section class="panel" style="margin-top:16px"><h3>${esc(c)} <span class="pill">${list.length} award${list.length===1?"":"s"}</span></h3><div class="list">${list.length?list.map((a,i)=>`<div class="item"><span><b>${i+1}. ${esc(a.title)}</b><br><span class="pill">${a.type==="duo"?"Duo text input":"Person vote"}</span> ${a.type==="person"?`<select class="mini" onchange="setAudience('${a.id}',this.value)">${audOptions(a.audience)}</select>`:""}</span><button class="btn danger small" onclick="delAward('${a.id}')">Delete</button></div>`).join(""):`<p class="sub" style="margin:8px 0">No awards in this category yet.</p>`}</div><div class="row" style="margin-top:14px"><input id="nt${ci}" placeholder="New award title"><select id="ntype${ci}"><option value="person">Person vote</option><option value="duo">Duo text input</option></select></div><div style="margin-top:9px"><select id="naud${ci}">${audOptions("all")}</select></div><br><button class="btn small" onclick="addAward(${ci})">+ Add to ${esc(c)}</button></section>`}).join("")}</main>`}
async function saveSettings(){try{await call("admin-save",{token:state.adminToken,event_name:document.getElementById("eventName").value,opening_at:document.getElementById("open").value?new Date(document.getElementById("open").value).toISOString():null,closing_at:document.getElementById("close").value?new Date(document.getElementById("close").value).toISOString():null});state.event=await call("event");renderAdmin()}catch(e){alert(e.message)}}
async function closeNow(){if(!confirm("Close voting now? Votes can no longer be changed."))return;await call("admin-save",{token:state.adminToken,close_now:true});state.event=await call("event");renderAdmin()}
async function reopenVoting(){if(!confirm("Reopen voting? This clears the closing time, so people can edit their votes again."))return;try{await call("admin-save",{token:state.adminToken,reopen:true});state.event=await call("event");await keepScroll(renderAdmin)}catch(e){alert(e.message)}}
async function addAward(ci){const c=ADMIN_CATS[ci],title=document.getElementById("nt"+ci).value.trim();if(!title)return alert("Enter an award title.");try{await call("award-add",{token:state.adminToken,title,category:c,type:document.getElementById("ntype"+ci).value,audience:document.getElementById("naud"+ci).value});await keepScroll(renderAdmin)}catch(e){alert(e.message)}}
async function setAudience(id,audience){try{await call("award-audience",{token:state.adminToken,id,audience});await keepScroll(renderAdmin)}catch(e){alert(e.message);await keepScroll(renderAdmin)}}
async function setSex(name,sex){try{await call("person-sex",{token:state.adminToken,name,sex});await keepScroll(renderAdmin)}catch(e){alert(e.message);await keepScroll(renderAdmin)}}
async function delAward(id){if(!confirm("Delete this award?"))return;try{await call("award-delete",{token:state.adminToken,id});await keepScroll(renderAdmin)}catch(e){alert(e.message)}}
async function photo(name,file){if(!file)return;try{const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Could not read that file"));r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("That file is not a usable image. Try a JPG or PNG."));i.src=url});const sc=Math.min(1,500/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext("2d").drawImage(img,0,0,c.width,c.height);const y=window.scrollY;await call("person-photo",{token:state.adminToken,name,photo:c.toDataURL("image/jpeg",0.85)});await renderAdmin();window.scrollTo(0,y)}catch(e){alert(e.message)}}

/* ---------- RESULTS PANEL ---------- */
async function renderResults(){try{state.resultsData=await call("results",{token:state.adminToken})}catch(e){alert(e.message);return}drawResults()}
function drawResults(){const r=state.resultsData,cats=[...new Set(r.results.map(x=>x.category))];
let h=topbar()+`<main><section class="hero" style="text-align:left"><div class="eyebrow">Results</div><h1 style="font-size:clamp(42px,6vw,70px)">${esc(r.event_name)}</h1><p class="sub" style="margin-left:0">${r.voters_submitted} of ${r.voters_total} people submitted their votes. Top 3 for every award, with percentages of the votes cast for that award.</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn secondary small" onclick="renderAdmin()">← Back to admin</button><button class="btn small" onclick="startPresentation()">🎬 Start Awards Night</button><button class="btn secondary small" onclick="downloadBackup()">⬇ Backup presentation (works offline)</button><button class="btn secondary small" onclick="downloadCSV()">⬇ Results (CSV)</button></div></section>`;
cats.forEach(c=>{const list=r.results.filter(x=>x.category===c);h+=`<div class="cat"><b>${esc(c)}</b><span>${list.length} award${list.length===1?"":"s"}</span></div>`;list.forEach(a=>{const ties=a.nominees.filter(n=>n.winner).length;h+=`<section class="q"><h3>${esc(a.title)} <span class="pill">${a.total_votes} vote${a.total_votes===1?"":"s"}</span> ${ties>1?`<span class="pill">🤝 Tie</span>`:""}</h3>`;
if(!a.nominees.length)h+=`<p class="sub" style="margin:0">No votes were cast for this award.</p>`;
a.nominees.forEach((n,i)=>{h+=`<div class="resrow ${n.winner?"win":""}"><span class="rank">${n.winner?"👑":i+1}</span><span><span class="dot" style="background:${esc(n.color)}"></span><b>${esc(n.name)}</b></span><div class="bar"><i style="width:${n.percent}%;background:${esc(n.color)}"></i></div><span class="rv"><b>${n.percent}%</b> · ${n.votes} vote${n.votes===1?"":"s"}</span></div>`});
h+=`</section>`})});
document.getElementById("app").innerHTML=h+`</main>`}

/* ---------- DOWNLOADS ---------- */
function download(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"awards";
function downloadCSV(){const r=state.resultsData,rows=[["Category","Award","Type","Rank","Nominee","Votes","Percent","Winner"]];r.results.forEach(a=>{if(!a.nominees.length)rows.push([a.category,a.title,a.type,"","(no votes)",0,"",""]);a.nominees.forEach((n,i)=>rows.push([a.category,a.title,a.type,i+1,n.name,n.votes,n.percent+"%",n.winner?"YES":""]))});const q=v=>`"${String(v).replace(/"/g,'""')}"`;download(slug(r.event_name)+"-results.csv","\ufeff"+rows.map(x=>x.map(q).join(",")).join("\r\n"),"text/csv;charset=utf-8")}
async function downloadBackup(){try{const res=await fetch(location.pathname,{cache:"no-store"});let src=await res.text();const marker='<div id="app"></div>';if(!src.includes(marker))throw Error("Could not read the page to build the backup. Refresh and try again.");const data={...state.resultsData,suspense:state.suspense!==false,backup_made:new Date().toISOString()};const blob=JSON.stringify(data).replace(/</g,"\\u003c");src=src.replace(marker,"<script>window.__BACKUP__="+blob+";<\/script>"+marker);download(slug(data.event_name)+"-awards-night-BACKUP.html",src,"text/html;charset=utf-8")}catch(e){alert(e.message)}}

/* ---------- AWARDS NIGHT PRESENTATION ---------- */
async function startPresentation(){try{state.resultsData=await call("results",{token:state.adminToken});const n=state.resultsData.results.length;modal(`<h2>Start Awards Night</h2><p>${n} award${n===1?"":"s"} ready to present.</p><label style="display:flex;gap:10px;align-items:center;font-weight:800"><input id="susp" type="checkbox" checked style="width:auto"> Show a "nominees" slide before each winner reveal</label><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="beginPresentation()">Start</button></div>`)}catch(e){alert(e.message)}}
function beginPresentation(){state.suspense=document.getElementById("susp").checked;closeModal();openPres(state.resultsData,state.suspense)}
function buildSlides(data,suspense){const s=[{k:"intro"}];data.results.forEach((a,i)=>{s.push({k:"title",a,i});if(suspense&&a.nominees.length)s.push({k:"nominees",a,i});s.push({k:"winner",a,i})});s.push({k:"outro"});return s}
function openPres(data,suspense){state.pres={data,slides:buildSlides(data,suspense),i:0};document.getElementById("pres")?.remove();document.body.insertAdjacentHTML("beforeend",'<div id="pres" class="pres"></div>');showPres()}
function card(n,mode,type){const w=mode==="win",stats=mode!=="plain"?`<div class="pct">${n.percent}%</div><div class="votes">${n.votes} vote${n.votes===1?"":"s"}</div>`:"",cls=mode==="plain"?"":(w?" winner":" notwinner"),name=`<div class="nomName">${w?"👑 ":""}${esc(n.name)}</div>`;
if(type==="duo")return `<div class="nom duo${cls}" style="background:#fff;border:1px solid var(--line)">${name}${stats}</div>`;
return `<div class="nom ${n.photo?"photo":""}${cls}" style="background:${esc(n.color)};color:${colorText(n.color)}">${n.photo?`<img src="${esc(n.photo)}">`:""}${name}${stats}</div>`}
function showPres(){const P=state.pres,el=document.getElementById("pres");if(!el||!P)return;const sl=P.slides[P.i],last=P.slides.length-1,total=P.data.results.length;let html="";
if(sl.k==="intro")html=`<div class="presCat">🏆 Award Night</div><h1 class="presTitle">${esc(P.data.event_name)}</h1><p class="presSub">${total} award${total===1?"":"s"} · press → or Space to begin</p>`;
else if(sl.k==="outro")html=`<div class="presCat">That's a wrap</div><h1 class="presTitle">Thank you for voting!</h1><p class="presSub">Congratulations to all the winners 👑</p>`;
else{const a=sl.a,head=`<div class="presCat">${esc(a.category)} · Award ${sl.i+1} of ${total}</div>`;
 if(sl.k==="title")html=head+`<h1 class="presTitle">${esc(a.title)}</h1>`;
 else if(sl.k==="nominees")html=head+`<h2 class="presAward">${esc(a.title)}</h2><div class="presLabel">The nominees</div><div class="nominees">${a.nominees.map(n=>card(n,"plain",a.type)).join("")}</div>`;
 else if(!a.nominees.length)html=head+`<h2 class="presAward">${esc(a.title)}</h2><p class="presSub">No votes were cast for this award.</p>`;
 else{const ties=a.nominees.filter(n=>n.winner).length;let list=a.nominees;if(ties===1&&list.length>=2)list=list.length>=3?[list[1],list[0],list[2],...list.slice(3)]:[list[1],list[0]];
  html=head+`<h2 class="presAward">${esc(a.title)}</h2>${ties>1?`<div class="tie">🤝 It's a tie!</div>`:`<div class="presLabel">And the winner is…</div>`}<div class="nominees">${list.map(n=>card(n,n.winner?"win":"other",a.type)).join("")}</div>`}}
const jump=P.slides.map((s,idx)=>s.k==="title"?`<option value="${idx}" ${(sl.a&&sl.i===s.i)?"selected":""}>${s.i+1}. ${esc(s.a.title)}</option>`:"").join("");
el.innerHTML=`<div class="presTop"><b>${esc(P.data.event_name)}</b><span style="display:flex;gap:8px;align-items:center"><select class="mini" onchange="pjump(this.value)"><option value="0" ${P.i===0?"selected":""}>Intro</option>${jump}<option value="${last}" ${P.i===last?"selected":""}>Ending</option></select><button class="btn secondary small" onclick="toggleFull()">⛶ Fullscreen</button><button class="btn secondary small" onclick="exitPres()">Exit</button></span></div><div class="stage"><div class="inner" key="${P.i}">${html}</div></div><div class="presNav"><button class="btn secondary small" onclick="pback()" ${P.i===0?"disabled":""}>← Back</button><span class="pcount">${P.i+1} / ${P.slides.length}</span><button class="btn small" onclick="pnext()" ${P.i===last?"disabled":""}>Next →</button></div><div class="help">← → or Space · F fullscreen · Esc exit</div>`}
function pnext(){const P=state.pres;if(P&&P.i<P.slides.length-1){P.i++;showPres()}}
function pback(){const P=state.pres;if(P&&P.i>0){P.i--;showPres()}}
function pjump(i){state.pres.i=Math.max(0,Math.min(state.pres.slides.length-1,+i));showPres()}
function toggleFull(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}}
function exitPres(){document.getElementById("pres")?.remove();try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}state.pres=null;if(window.__BACKUP__)return showBackupHome();drawResults()}
function showBackupHome(){document.getElementById("app").innerHTML=`<main><section class="hero"><div class="eyebrow">Backup copy</div><h1>${esc(window.__BACKUP__.event_name)}</h1><p class="sub">This offline copy has all the results saved inside it. It needs no internet.</p><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="openPres(window.__BACKUP__,window.__BACKUP__.suspense!==false)">🎬 Restart presentation</button><button class="btn secondary" onclick="downloadCSV()">⬇ Results (CSV)</button></div></section></main>`}
document.addEventListener("keydown",e=>{if(!document.getElementById("pres"))return;const k=e.key;if(k==="ArrowRight"||k===" "||k==="PageDown"||k==="Enter"){e.preventDefault();pnext()}else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();pback()}else if(k==="Home"){e.preventDefault();pjump(0)}else if(k==="End"){e.preventDefault();pjump(state.pres.slides.length-1)}else if(k==="Escape"){exitPres()}else if(k==="f"||k==="F"){toggleFull()}});
init();

</script>
</body></html>
