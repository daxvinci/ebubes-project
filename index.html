<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plans for Days x The Boys Awards 2026</title>
<style>
:root{--bg:#f7f3ee;--ink:#2d2927;--muted:#776f69;--line:#e7ddd5;--card:#fff;--accent:#6b4f3a;--r:26px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#f7f3eef2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:-.035em}.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
main{width:min(1100px,calc(100% - 28px));margin:auto;padding:25px 0 70px}.hero{text-align:center;padding:46px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-weight:950;font-size:11px;color:var(--accent)}h1{font-size:clamp(38px,7vw,78px);line-height:.94;letter-spacing:-.06em;margin:13px auto;max-width:900px}h2{letter-spacing:-.035em}.sub{max-width:680px;margin:0 auto 22px;color:var(--muted);line-height:1.55}
.btn{background:var(--ink);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:900;box-shadow:0 8px 22px #2d29271c}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#8d3030}.btn.small{padding:9px 12px;font-size:13px;border-radius:13px}.ghost{background:transparent;border:0;font-weight:900;padding:10px;border-radius:999px}.ghost:hover{background:#fff}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.person{min-height:145px;border:1px solid #0000000d;border-radius:28px;padding:19px;text-align:left;box-shadow:0 14px 35px #2d29270f;display:flex;flex-direction:column;justify-content:space-between;transition:.16s}.person:hover{transform:translateY(-2px)}.person.voted{filter:saturate(.5) brightness(.88)}.person img{width:58px;height:58px;object-fit:cover;border-radius:19px;border:3px solid #ffffffb8}.person .name{font-size:22px;font-weight:950;letter-spacing:-.04em}.status{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.progress{position:sticky;top:66px;z-index:10;padding:12px 0;background:#f7f3eef4;backdrop-filter:blur(10px)}.progline{display:flex;justify-content:space-between;font-size:13px;font-weight:950;margin-bottom:7px}.track{height:9px;background:#e5ddd6;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--ink);border-radius:99px;transition:.2s}
.cat{margin:28px 0 12px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:12px 16px;display:flex;justify-content:space-between}.cat span{font-size:11px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.1em}.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:12px 0;box-shadow:0 9px 26px #2d29270b}.q h3{margin:0 0 15px;letter-spacing:-.025em}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{min-height:64px;border:2px solid transparent;background:#faf8f6;border-radius:20px;padding:12px;text-align:left;font-weight:900}.choice.selected{border-color:var(--ink);box-shadow:0 0 0 3px #2d292714}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:17px;padding:13px 15px;background:#fff;outline:0}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#a28c7b;box-shadow:0 0 0 4px #6b4f3a12}.actions{display:flex;justify-content:space-between;gap:10px;margin:22px 0}.notice{background:#fff8e8;border:1px solid #f0dfb8;border-radius:18px;padding:14px 16px;color:#6b5527;font-weight:750}
.modalbg{position:fixed;inset:0;background:#19151373;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(540px,100%);background:#fff;border-radius:30px;padding:24px;box-shadow:0 30px 90px #0004}.modal h2{margin-top:0}.mactions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 12px 32px #2d29270b}.panel h3{margin-top:0}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:18px;padding:11px 13px}.pill{display:inline-flex;border-radius:999px;background:#f2ece7;padding:6px 9px;font-size:11px;font-weight:950}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pres{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column}.presTop{padding:15px 22px;display:flex;justify-content:space-between}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}.inner{width:min(1350px,94vw);text-align:center}.presCat{font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:15px}.presTitle{font-size:clamp(48px,9vw,120px);line-height:.9;letter-spacing:-.065em;margin:0;font-weight:950}.nominees{display:flex;justify-content:center;gap:18px;align-items:stretch;flex-wrap:wrap}.nom{width:min(28vw,300px);min-width:180px;min-height:330px;border-radius:34px;padding:19px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:0 18px 50px #2d29271c}.nom img{display:none;width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;margin-bottom:13px}.nom.photo img{display:block}.nomName{font-size:clamp(21px,3vw,36px);font-weight:950;letter-spacing:-.045em}.crown{display:none;position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:42px}.winner .crown{display:block}.winner{transform:scale(1.12);z-index:2;box-shadow:0 28px 75px #2d29274a!important}.notwinner{transform:scale(.9);opacity:.8}.votes{font-weight:900;opacity:.7;margin-top:5px}.presNav{padding:15px 20px 24px;display:flex;justify-content:center;gap:9px}.help{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
@media(max-width:760px){.people,.choices,.adminGrid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.nom{min-width:145px;width:38vw;min-height:240px}}
@media(max-width:520px){.people,.choices,.adminGrid{grid-template-columns:1fr}.nom{width:72vw}.winner{transform:scale(1.03)}}
</style>
</head>
<body><div id="app"></div>
<script>
const state={event:null,me:null,answers:{},mode:"home",presIndex:0,presStage:0};
const api=path=>"/api/"+path;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const colorText=h=>{let x=h.replace("#","");let r=parseInt(x.slice(0,2),16),g=parseInt(x.slice(2,4),16),b=parseInt(x.slice(4,6),16);return (r*299+g*587+b*114)/1000>165?"#2d2927":"#fff"};
async function call(path,body={}){let r=await fetch(api(path),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||"Something went wrong");return j}
function top(){return `<div class="top"><div class="brand">${esc(state.event?.event_name||"Award Night")}<small>Award Night 2026</small></div><button class="ghost" onclick="admin()">Admin</button></div>`}
async function init(){try{state.event=await call("event");renderHome()}catch(e){document.getElementById("app").innerHTML=`<main><section class="hero"><h1>Setup needed</h1><p class="sub">${esc(e.message)}</p></section></main>`}}
function renderHome(){
 const e=state.event; const people=e.people; const voted=e.voted_count;
 const cards=people.map(p=>`<button class="person ${p.voted?"voted":""}" style="background:${p.color};color:${colorText(p.color)}" onclick="pick('${esc(p.name)}')">${p.photo?`<img src="${esc(p.photo)}">`:""}<div><div class="name">${esc(p.name)}</div><div class="status">${p.voted?"Voted ✓":"Not voted"}</div></div></button>`).join("");
 document.getElementById("app").innerHTML=top()+`<main><section class="hero"><div class="eyebrow">🏆 Award Night</div><h1>${esc(e.event_name)}</h1><p class="sub">Vote for your friends. You can return and change your answers until voting closes.</p>${e.closed?`<div class="notice">🔒 Voting has closed.</div>`:e.not_open?`<div class="notice">⏳ Voting has not opened yet.</div>`:`<div class="pill">${voted}/${people.length} people have voted</div>`}</section><div class="people">${cards}</div></main>`;
}
async function pick(name){
 if(state.event.closed||state.event.not_open)return;
 try{let existing=await call("voter",{name});state.me=name;
  if(existing.exists) modal(`<h2>You're voting as ${esc(name)}</h2><p>Enter your voting password to continue.</p><input id="pass" type="password" placeholder="Password"><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="unlock()">Continue</button></div>`);
  else modal(`<h2>You're voting as ${esc(name)}</h2><p>Create a password. You can use it to return and change answers before voting closes.</p><input id="pass" type="password" placeholder="Create password"><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="createVoter()">Create & Continue</button></div>`);
 }catch(e){alert(e.message)}
}
async function createVoter(){let p=document.getElementById("pass").value;if(!p)return alert("Enter a password.");try{await call("voter",{name:state.me,password:p,create:true});closeModal();await loadVoting()}catch(e){alert(e.message)}}
async function unlock(){let p=document.getElementById("pass").value;try{let r=await call("voter",{name:state.me,password:p,login:true});state.answers=r.answers||{};closeModal();await loadVoting()}catch(e){alert(e.message)}}
async function loadVoting(){let r=await call("questions",{voter:state.me,password:await getSessionPassword()});state.answers=r.answers||{};state.questions=r.questions;renderVoting()}
let sessionPass="";
async function getSessionPassword(){return sessionPass}
async function createAndStorePassword(){return ""}
function renderVoting(){
 const qs=state.questions,total=qs.length,answered=qs.filter(q=>state.answers[q.id]).length;
 const cats=[...new Set(qs.map(q=>q.category))];
 let body=`<main><div class="progress"><div class="progline"><span>Voting as ${esc(state.me)}</span><span>${answered}/${total} questions answered</span></div><div class="track"><div class="fill" style="width:${total?answered/total*100:0}%"></div></div></div>`;
 cats.forEach(c=>{body+=`<div class="cat"><b>${esc(c)}</b><span>${qs.filter(q=>q.category===c).length} questions</span></div>`;qs.filter(q=>q.category===c).forEach(q=>{
 body+=`<section class="q"><h3>${esc(q.title)}</h3>`;
 if(q.type==="person")body+=`<div class="choices">${state.event.people.map(p=>{let sel=state.answers[q.id]===p.name;return `<button class="choice ${sel?"selected":""}" style="${sel?`background:${p.color};color:${colorText(p.color)}`:""}" onclick="answer('${esc(q.id)}','${esc(p.name)}')"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`}).join("")}</div>`;
 else body+=`<textarea oninput="duo('${esc(q.id)}',this.value)" placeholder="Enter the two people...">${esc(state.answers[q.id]||"")}</textarea><p style="font-size:12px;color:var(--muted)">Text input only. Enter the two people.</p>`;
 body+=`</section>`})});
 body+=`<div class="actions"><button class="btn secondary" onclick="renderHome()">Save & return later</button><button class="btn" onclick="submit()">Submit final votes</button></div><div class="notice">Your answers stay editable until the official closing time.</div></main>`;
 document.getElementById("app").innerHTML=top()+body;
}
async function answer(id,val){state.answers[id]=val;saveRemote(false);renderVoting()}
let saveTimer;function duo(id,val){state.answers[id]=val.trim();clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveRemote(false),400)}
async function saveRemote(submitted){try{await call("save",{voter:state.me,password:sessionPass,answers:state.answers,submitted})}catch(e){}}
async function submit(){let missing=state.questions.filter(q=>!state.answers[q.id]);if(missing.length)return alert(`Please answer all ${missing.length} remaining question${missing.length>1?"s":""}.`);try{await call("save",{voter:state.me,password:sessionPass,answers:state.answers,submitted:true});render(`<main><section class="hero"><div class="eyebrow">✓ Submitted</div><h1>You're done, ${esc(state.me)}.</h1><p class="sub">Your votes are saved. You can come back with your password and change them until voting closes.</p><button class="btn" onclick="state.event=null;init()">Back to voting home</button></section></main>`)}catch(e){alert(e.message)}}
function modal(x){let d=document.createElement("div");d.id="modal";d.className="modalbg";d.innerHTML=`<div class="modal">${x}</div>`;document.body.appendChild(d);setTimeout(()=>document.getElementById("pass")?.focus(),40)}
function closeModal(){document.getElementById("modal")?.remove()}
async function admin(){modal(`<h2>Admin controls</h2><p>Enter your admin password.</p><input id="pass" type="password" placeholder="Admin password"><div class="mactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="unlockAdmin()">Enter</button></div>`)}
async function unlockAdmin(){try{let r=await call("admin",{password:document.getElementById("pass").value});closeModal();state.adminToken=r.token;renderAdmin()}catch(e){alert(e.message)}}
async function renderAdmin(){let e=await call("admin-data",{token:state.adminToken});state.admin=e;document.getElementById("app").innerHTML=top()+`<main><section class="hero" style="text-align:left"><div class="eyebrow">Admin</div><h1 style="font-size:clamp(42px,6vw,70px)">Control Room</h1><p class="sub" style="margin-left:0">Manage people, awards, voting and the presentation.</p></section><div class="adminGrid">
<section class="panel"><h3>Event</h3><input id="eventName" value="${esc(e.event.event_name)}"><br><br><div class="row"><label>Opens<input id="open" type="datetime-local" value="${e.event.opening_at?e.event.opening_at.slice(0,16):""}"></label><label>Closes<input id="close" type="datetime-local" value="${e.event.closing_at?e.event.closing_at.slice(0,16):""}"></label></div><br><button class="btn small" onclick="saveSettings()">Save settings</button> <button class="btn danger small" onclick="closeNow()">Close voting now</button><p><b>${e.voted_count}/${e.people.length}</b> people have voted.</p><button class="btn small" onclick="startPresentation()">🎬 Start Award Night</button></section>
<section class="panel"><h3>People</h3><div class="list">${e.people.map(p=>`<div class="item"><span><b>${esc(p.name)}</b> <span class="pill">${p.voted?"Voted":"Not voted"}</span></span><label class="btn secondary small">Photo<input type="file" accept="image/*" hidden onchange="photo('${esc(p.name)}',this.files[0])"></label></div>`).join("")}</div></section></div>
<section class="panel" style="margin-top:16px"><h3>Awards</h3><div class="list">${e.awards.map((a,i)=>`<div class="item"><span><b>${i+1}. ${esc(a.title)}</b><br><span class="pill">${esc(a.category)} · ${a.type}</span></span><button class="btn danger small" onclick="delAward('${a.id}')">Delete</button></div>`).join("")}</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Add award</h3><div class="row"><input id="nt" placeholder="Award title"><select id="nc"><option>Personality</option><option>Wild / Funny</option><option>Inspirational</option></select></div><br><select id="ntype"><option value="person">Person vote</option><option value="duo">Duo text input</option></select><br><br><button class="btn small" onclick="addAward()">Add award</button></section></main>`}
async function saveSettings(){try{await call("admin-save",{token:state.adminToken,event_name:document.getElementById("eventName").value,opening_at:document.getElementById("open").value?new Date(document.getElementById("open").value).toISOString():null,closing_at:document.getElementById("close").value?new Date(document.getElementById("close").value).toISOString():null});state.event=await call("event");renderAdmin()}catch(e){alert(e.message)}}
async function closeNow(){if(!confirm("Close voting now? Votes can no longer be changed."))return;await call("admin-save",{token:state.adminToken,close_now:true});state.event=await call("event");renderAdmin()}
async function addAward(){let title=document.getElementById("nt").value.trim();if(!title)return alert("Enter an award title.");try{await call("award-add",{token:state.adminToken,title,category:document.getElementById("nc").value,type:document.getElementById("ntype").value});renderAdmin()}catch(e){alert(e.message)}}
async function delAward(id){if(!confirm("Delete this award?"))return;await call("award-delete",{token:state.adminToken,id});renderAdmin()}
async function photo(name,file){if(!file)return;let r=new FileReader();r.onload=async()=>{await call("person-photo",{token:state.adminToken,name,photo:r.result});renderAdmin()};r.readAsDataURL(file)}
async function startPresentation(){let r=await call("results",{token:state.adminToken});state.results=r.results;state.presIndex=0;state.presStage=0;document.body.insertAdjacentHTML("beforeend",`<div id="pres" class="pres"></div>`);showPres()}
function showPres(){let el=document.getElementById("pres");if(!el)return;if(state.presIndex>=state.results.length){el.remove();renderAdmin();return}let r=state.results[state.presIndex], html="";if(state.presStage===0)html=`<div class="presCat">${esc(r.category)}</div><h1 class="presTitle">${esc(r.title)}</h1>`;else if(state.presStage===1)html=`<div class="presCat">${esc(r.category)}</div><div class="nominees">${r.nominees.map(n=>card(n,false,r.type)).join("")}</div>`;else html=`<div class="presCat">${esc(r.category)}</div><div class="nominees">${r.nominees.map((n,i)=>card(n,i===0,r.type,n.votes)).join("")}</div>`;
el.innerHTML=`<div class="presTop"><b>${esc(state.event.event_name)}</b><button class="btn secondary small" onclick="document.getElementById('pres').remove();renderAdmin()">Exit</button></div><div class="stage"><div class="inner">${html}</div></div><div class="presNav"><button class="btn secondary small" onclick="pback()">← Back</button><button class="btn small" onclick="pnext()">Next →</button></div><div class="help">← → or Space</div>`}
function card(n,w,type,votes){if(type==="duo")return `<div class="nom ${w?"winner":"notwinner"}" style="background:#fff;border:1px solid var(--line)"><div class="crown">👑</div><div class="nomName">${esc(n.name)}</div>${votes!==undefined?`<div class="votes">${votes} vote${votes===1?"":"s"}</div>`:""}</div>`;return `<div class="nom ${n.photo?"photo ":""}${w?"winner":"notwinner"}" style="background:${n.color};color:${colorText(n.color)}"><div class="crown">👑</div>${n.photo?`<img src="${esc(n.photo)}">`:""}<div class="nomName">${esc(n.name)}</div>${votes!==undefined?`<div class="votes">${votes} vote${votes===1?"":"s"}</div>`:""}</div>`}
function pnext(){if(state.presStage<2)state.presStage++;else{state.presIndex++;state.presStage=0}showPres()}function pback(){if(state.presStage>0)state.presStage--;else if(state.presIndex>0){state.presIndex--;state.presStage=2}showPres()}
document.addEventListener("keydown",e=>{if(!document.getElementById("pres"))return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();pnext()}if(e.key==="ArrowLeft"){e.preventDefault();pback()}})
init();
</script>
</body></html>
